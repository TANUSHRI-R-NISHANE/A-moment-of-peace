<body>

    <div class="d1">

        <div class="top-shape"></div>

        <div class="card">

            <h1>A Moment of Peace</h1>

            <p class="subtitle">Turn off your phone,put on your headphones
                 <br> and take a moment for yourself.
                </p>

                <hr>

            <h2>How long would you like <br>
                 your moment to be?
                </h2>

                <div >
                    <button id="btn20" class="time-btn"> 20 <br> <span>Seconds</span> </button>

                    <button id="btn30" class="time-btn"> 30 <br> <span>Seconds</span> </button>

                    <button id="btn40" class="time-btn"> 40 <br> <span>Seconds</span> </button>

                    <button id="btn1" class="time-btn"> 1 <br> <span>Seconds</span> </button>
                    
                 </div> 

            <p id="timerText" class="timer-text">Select your Time</p>

        </div>

            <div class="bottom-shape"></div>

    </div>
